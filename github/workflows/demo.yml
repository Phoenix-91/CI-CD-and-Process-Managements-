name: CI

on:
  push:
  pull_request:

jobs:
  check-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README
        run: |
          if [ -f README.md ]; then
            echo "README.md exists ✅"
          else
            echo "README.md is missing ❌"
            exit 1
          fi